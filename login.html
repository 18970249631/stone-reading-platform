<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书易创 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        
        .login-header { text-align: center; margin-bottom: 35px; }
        .login-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 18px; }
        .login-title { font-size: 26px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .login-subtitle { font-size: 14px; color: #999; }
        
        .tabs { display: flex; background: #f5f5f5; border-radius: 12px; padding: 4px; margin-bottom: 25px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .tab.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 13px 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; transition: all 0.3s; }
        .form-group input:focus { border-color: #667eea; }
        .form-group input::placeholder { color: #ccc; }
        
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        
        .code-btn { padding: 13px 16px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; color: #666; cursor: pointer; transition: all 0.3s; }
        .code-btn:hover { background: #eee; }
        .code-btn.disabled { background: #eee; color: #999; cursor: not-allowed; }
        
        .remember-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; }
        .remember input { width: 18px; height: 18px; }
        .forgot { color: #667eea; font-size: 13px; text-decoration: none; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: #f5f5f5; color: #666; margin-top: 12px; }
        .btn-secondary:hover { background: #eee; }
        
        .divider { display: flex; align-items: center; gap: 15px; margin: 25px 0; }
        .divider-line { flex: 1; height: 1px; background: #eee; }
        .divider-text { font-size: 13px; color: #999; }
        
        .social-login { display: flex; gap: 12px; }
        .social-btn { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .social-btn:hover { background: #f5f5f5; }
        
        .footer-links { text-align: center; margin-top: 30px; }
        .footer-links a { color: #999; font-size: 13px; margin: 0 10px; text-decoration: none; }
        .footer-links a:hover { color: #667eea; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; }
        .modal-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 20px; }
        .modal-close { float: right; font-size: 24px; cursor: pointer; color: #999; }
        
        .toast { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px 20px; border-radius: 10px; z-index: 2000; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
            .form-row { flex-direction: column; }
            .social-login { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">📚</div>
                <h1 class="login-title">书易创</h1>
                <p class="login-subtitle">发现你的阅读世界</p>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">密码登录</div>
                <div class="tab" onclick="switchTab('code')">验证码登录</div>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>账号/手机号/邮箱</label>
                    <input type="text" id="account" placeholder="请输入账号、手机号或邮箱" required>
                </div>
                
                <div class="form-group" id="passwordGroup">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                
                <div class="form-row" id="codeGroup" style="display: none;">
                    <div class="form-group">
                        <label>验证码</label>
                        <input type="text" id="code" placeholder="请输入验证码" required>
                    </div>
                    <button type="button" class="code-btn" id="getCodeBtn" onclick="getCode()">获取验证码</button>
                </div>
                
                <div class="remember-row">
                    <label class="remember">
                        <input type="checkbox" id="remember"> 记住我
                    </label>
                    <a href="#" class="forgot" onclick="showForgotModal()">忘记密码?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">登录</button>
                <button type="button" class="btn btn-secondary" onclick="goGuest()">继续浏览（游客模式）</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">其他方式登录</span>
                <div class="divider-line"></div>
            </div>
            
            <div class="social-login">
                <button class="social-btn" onclick="socialLogin('wechat')">
                    <span>💬</span> 微信
                </button>
                <button class="social-btn" onclick="socialLogin('qq')">
                    <span>🐧</span> QQ
                </button>
            </div>
            
            <div class="footer-links">
                <a href="#" onclick="showModal('register')">注册账号</a>
                <a href="#" onclick="showModal('bind')">绑定手机号</a>
                <a href="#" onclick="showModal('logout')">账号注销</a>
            </div>
        </div>
    </div>
    
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('forgotModal')">×</span>
            <h3 class="modal-title">找回密码</h3>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="forgotPhone" placeholder="请输入注册手机号">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>验证码</label>
                    <input type="text" id="forgotCode" placeholder="请输入验证码">
                </div>
                <button type="button" class="code-btn" onclick="getForgotCode()">获取验证码</button>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="forgotPassword" placeholder="请输入新密码">
            </div>
            <button class="btn btn-primary" onclick="resetPassword()">确认重置</button>
        </div>
    </div>
    
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('registerModal')">×</span>
            <h3 class="modal-title">注册账号</h3>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>验证码</label>
                    <input type="text" id="regCode" placeholder="请输入验证码">
                </div>
                <button type="button" class="code-btn" onclick="getRegCode()">获取验证码</button>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regPassword2" placeholder="请再次输入密码">
            </div>
            <button class="btn btn-primary" onclick="register()">注册</button>
        </div>
    </div>
    
    <script>
        const API_BASE = '';
        let codeTimer = null;
        
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (type === 'login') {
                document.getElementById('passwordGroup').style.display = 'block';
                document.getElementById('codeGroup').style.display = 'none';
            } else {
                document.getElementById('passwordGroup').style.display = 'none';
                document.getElementById('codeGroup').style.display = 'flex';
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('code').value;
            const remember = document.getElementById('remember').checked;
            
            if (document.querySelector('.tab.active').textContent === '密码登录') {
                if (!password) {
                    showToast('请输入密码');
                    return;
                }
                const result = await fetch(API_BASE + '/api/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account, password })
                }).then(r => r.json());
                
                if (result.success) {
                    if (remember) {
                        localStorage.setItem('shuyic_user', JSON.stringify({ account, loginTime: new Date().toISOString() }));
                    }
                    showToast('登录成功！');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    showToast(result.message || '登录失败');
                }
            } else {
                if (!code) {
                    showToast('请输入验证码');
                    return;
                }
                const result = await fetch(API_BASE + '/api/user/login/code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: account, code })
                }).then(r => r.json());
                
                if (result.success) {
                    if (remember) {
                        localStorage.setItem('shuyic_user', JSON.stringify({ phone: account, loginTime: new Date().toISOString() }));
                    }
                    showToast('登录成功！');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    showToast(result.message || '登录失败');
                }
            }
        }
        
        function getCode() {
            const phone = document.getElementById('account').value;
            if (!phone) {
                showToast('请先输入手机号');
                return;
            }
            
            const btn = document.getElementById('getCodeBtn');
            btn.classList.add('disabled');
            btn.textContent = '发送中...';
            
            fetch(API_BASE + '/api/user/code/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            }).then(r => r.json()).then(result => {
                if (result.success) {
                    showToast('验证码已发送');
                    let count = 180;
                    codeTimer = setInterval(() => {
                        count--;
                        if (count <= 0) {
                            clearInterval(codeTimer);
                            btn.classList.remove('disabled');
                            btn.textContent = '获取验证码';
                        } else {
                            btn.textContent = `${count}秒后重试`;
                        }
                    }, 1000);
                } else {
                    btn.classList.remove('disabled');
                    btn.textContent = '获取验证码';
                    showToast(result.message || '发送失败');
                }
            });
        }
        
        function showForgotModal() {
            document.getElementById('forgotModal').classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        function showModal(type) {
            if (type === 'register') {
                document.getElementById('registerModal').classList.add('active');
            }
        }
        
        function getForgotCode() {
            const phone = document.getElementById('forgotPhone').value;
            if (!phone) {
                showToast('请输入手机号');
                return;
            }
            showToast('验证码已发送');
        }
        
        function resetPassword() {
            const phone = document.getElementById('forgotPhone').value;
            const code = document.getElementById('forgotCode').value;
            const password = document.getElementById('forgotPassword').value;
            
            if (!phone || !code || !password) {
                showToast('请填写完整信息');
                return;
            }
            
            showToast('密码重置成功！');
            closeModal('forgotModal');
        }
        
        function getRegCode() {
            const phone = document.getElementById('regPhone').value;
            if (!phone) {
                showToast('请输入手机号');
                return;
            }
            showToast('验证码已发送');
        }
        
        function register() {
            const phone = document.getElementById('regPhone').value;
            const code = document.getElementById('regCode').value;
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            
            if (!phone || !code || !password) {
                showToast('请填写完整信息');
                return;
            }
            
            if (password !== password2) {
                showToast('两次密码不一致');
                return;
            }
            
            showToast('注册成功！');
            closeModal('registerModal');
        }
        
        function socialLogin(type) {
            showToast(`${type === 'wechat' ? '微信' : 'QQ'}登录功能开发中`);
        }
        
        function goGuest() {
            localStorage.setItem('shuyic_guest', 'true');
            window.location.href = 'index.html';
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('shuyic_user');
            if (saved) {
                const user = JSON.parse(saved);
                document.getElementById('account').value = user.account || user.phone || '';
                document.getElementById('remember').checked = true;
            }
        });
    </script>
</body>
</html>
