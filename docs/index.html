<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>砾石阅读 - 发现你的阅读世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .status {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            color: #0369a1;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .info {
            background: #f0fdf4;
            border: 1px solid #22c55e;
            color: #166534;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .info h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info ul {
            list-style: none;
            padding-left: 0;
        }
        .info li {
            padding: 5px 0;
            font-size: 14px;
        }
        .info li strong {
            color: #166534;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>砾石阅读平台</h1>
        <p>发现你的阅读世界</p>
        
        <div class="status">
            ✅ GitHub Pages 部署成功！
        </div>
        
        <div class="info">
            <h3>🎯 测试账号</h3>
            <ul>
                <li><strong>普通用户：</strong>testuser / test123</li>
                <li><strong>VIP 用户：</strong>vipuser / test123</li>
                <li><strong>管理员：</strong>admin / test123</li>
                <li><strong>作家：</strong>author / test123</li>
            </ul>
        </div>
        
        <div class="info">
            <h3>📖 项目说明</h3>
            <ul>
                <li>这是一个临时展示页面</li>
                <li>完整 Vue 应用正在构建中</li>
                <li>后端需要本地运行</li>
            </ul>
        </div>
        
        <a href="https://github.com/18970249631/stone-reading-platform" class="btn">
            查看 GitHub 仓库
        </a>
    </div>
</body>
</html>
