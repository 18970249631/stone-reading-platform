<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>砾石阅读平台 - 部署中</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        .status {
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .info {
            color: #666;
            line-height: 1.8;
            margin-top: 20px;
        }
        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 砾石阅读平台</h1>
        <div class="status">🚀 GitHub Pages 自动部署已配置</div>
        <div class="info">
            <p>平台正在部署中，请稍等几分钟...</p>
            <p>GitHub Actions 正在自动构建前端代码</p>
            <p>访问 <a href="https://github.com/18970249631/stone-reading-platform" class="link">项目仓库</a> 查看进度</p>
            <p>完整功能需要后端服务支持，请在本地运行项目</p>
        </div>
    </div>
</body>
</html>
